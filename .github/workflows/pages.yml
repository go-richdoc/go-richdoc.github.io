name: pages

on:
  push:
    branches: [main]
  # Build on every pull request too, so a change to the layout, the content,
  # the Hugo version or one of the actions below has to prove the site still
  # builds before it lands.
  pull_request:
  workflow_dispatch:

# The build needs nothing beyond the source and the Pages configuration it
# reads to compute the base URL. Publishing rights are granted to the deploy
# job alone, below, so a pull request build cannot replace what is served.
permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build landing page
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # ⛔ THERE IS DELIBERATELY NO govulncheck LANE HERE, and this comment exists
  # so that nobody adds one again — I did, on 2026-11-08, and measured why it
  # cannot work.
  #
  # `gofloor go-richdoc` counts this repository among the organisation's "11 Go
  # repositories" and reports "no govulncheck step", because there IS a go.mod.
  # But read kit.go: it is `//go:build tools`, it never builds, and it exists
  # only so that `go mod tidy` keeps the landingkit requirement which Hugo
  # resolves as a HUGO module (templates, not Go code that compiles or runs).
  #
  # So the organisation's shared lane, added here and then removed, failed in
  # 34 seconds with the right answer:
  #
  #     govulncheck: no packages matched the provided patterns
  #     ::error::govulncheck exited without reporting that it loaded the
  #     packages (no SBOM in its output): the scan did not run, which is not
  #     the same as finding nothing
  #
  # That refusal is the gate working. "Does this module reach a known
  # vulnerability" has no meaning where no package builds, and forcing a green
  # — a build tag, or `-scan module` — would publish a clean verdict about a
  # scan that read nothing, which is the one failure the lane exists to
  # prevent.
  #
  # What protects this repository instead: the landingkit version is pinned in
  # go.mod and bumped by Renovate, and landingkit's OWN repository is a Go
  # module whose CI can scan it. The question belongs there, not here.

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # ⛔ A GREEN DEPLOY IS NOT A SERVED PAGE. go-ooxml's Pages source was a
      # branch -- Jekyll, from main -- so the live site was the default
      # theme's rendering of README.md while that same workflow built the Hugo
      # site, uploaded it and reported success three times. Every signal was
      # green and none of them looked at the URL.
      #
      # So look at the URL. Hugo writes its own generator meta; Jekyll writes
      # Jekyll's.
      - name: The page that is served is the page we built
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "serving: $url"
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsSL --max-time 20 "$url" || true)
            # ⛔ The pattern matches the MINIFIED output: `hugo --minify` drops
            # the quotes around an attribute name, so the served page says
            # `name=generator content="Hugo 0.167.0"` and a pattern written
            # from the source would match nothing -- a check that can only
            # fail is not a check.
            case "$body" in
              *'content="Hugo'*) echo "Hugo, as built"; exit 0 ;;
            esac
            echo "attempt $i: not ours yet, waiting"
            sleep 10
          done
          echo "::error::$url is not serving this build."
          echo "$body" | grep -i generator || echo "(no generator meta at all)"
          echo "Check Settings -> Pages: the source must be GitHub Actions, not a branch."
          exit 1
