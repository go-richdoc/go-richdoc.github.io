baseURL = "https://go-richdoc.github.io/"
title = "go-richdoc"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted, and this landing was one of the drifted ones. It carried a brand.css
# and a theme.js of its own, written before the kit existed. The version is
# pinned in go.mod (Renovate bumps it), and kit.go keeps `go mod tidy` from
# deleting that requirement. A file of the same name under layouts/partials/
# would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

# ⛔ TARGETS BUILT, which is not "architectures the tests run on". These ten
# modules cross-build for ten targets and run their suites on amd64 with the
# race detector. Only go-ooxml, where a ZIP's little-endian integers are the
# risk, runs its suite under qemu as well -- and its landing claimed six
# architectures "and the tests run on every one" while they ran on one,
# because the page had been copied from go-pdfkit where it was true. Which
# claim this list supports is therefore said in the page, not left to a reader.
[params]
  targets = [
    "linux/amd64", "linux/arm64", "linux/riscv64", "linux/loong64",
    "linux/ppc64le", "linux/s390x", "darwin/amd64", "darwin/arm64",
    "windows/amd64", "js/wasm",
  ]

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours
# are READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 15.99:1, bright on the dark background 3.07:1.
  base = "#1e1b4b"
  deep = "#12102e"
  bright = "#4f46e5"
  shadow = "rgba(30,27,75,.7)"
  glow = "rgba(30,27,75,.6)"
  wash = "rgba(30,27,75,.10)"
  washDeep = "rgba(18,16,46,.06)"
  chipBg = "#eae9fc"
  chipBorder = "#cac8f7"
  chipFg = "#12102e"
  chipBgDark = "rgba(79,70,229,.14)"
  chipBorderDark = "rgba(79,70,229,.32)"
  chipFgDark = "#9e99f1"
  statsEnd = "#d5d3f9"
  bandText = "#e3e1fb"

[[params.repos]]
  name = "richdoc"
  pkg = "github.com/go-richdoc/richdoc"
  url = "https://github.com/go-richdoc/richdoc"
  status = "ready"
  blurb = "**The model itself** — an ordered list of blocks and a `map[string]string` of metadata, with no rendering, no parsing and no I/O at all. ⛔ Blocks and inlines are **closed interface sets**: every concrete type carries an unexported marker method, so a converter can type-switch over them and the compiler knows when a case is missing. `RawBlock` and `RawInline` carry format-specific passthrough, which is what lets a round trip keep what the model has no word for. A cell holds **blocks**, not a line of text, because reST's grid tables and HTML's `<td>` both allow a paragraph, a list and a table inside one cell."

[[params.repos]]
  name = "markdown"
  pkg = "github.com/go-richdoc/markdown"
  url = "https://github.com/go-richdoc/markdown"
  status = "ready"
  blurb = "**CommonMark and GFM, both directions.** Parsing delegates to [goldmark](https://github.com/yuin/goldmark), the reference Go implementation — tables, strikethrough, PHP-Markdown-Extra footnotes — rather than hand-rolling a CommonMark parser. ⛔ `WithAutoHeadingID` is deliberately **off**: auto ids would fabricate an anchor on every heading, and the writer would then stamp a `{#id}` the source never had. Only an anchor an author wrote is kept, which is what makes the round trip faithful rather than merely reversible. ⛔ Block nesting is **bounded** (v0.11.0), because parsing it is quadratic while writing it is cheap: 400 KB of nested block quotes occupied a core for 22 seconds, and one line of `*   *   *   …` nests a list at four bytes a level. The default of 256 comes from reading the 14 651 real `.md` files on one machine — the deepest carries five `>` markers — and the check runs **before** goldmark, which is where 92% of the time was going. ⛔ A footnote whose body cites itself was `fatal error: stack overflow` in fifty-five bytes, which no `recover()` catches: found by the fuzz target, after an audit for that same shape elsewhere in the family had swept past it."

[[params.repos]]
  name = "rst"
  pkg = "github.com/go-richdoc/rst"
  url = "https://github.com/go-richdoc/rst"
  status = "ready"
  blurb = "**reStructuredText, both directions**, on [go-docutils](https://github.com/go-docutils/docutils)'s engine. ⛔ It ships no reST parser of its own, because there is no gap to fill: `docutils/rst` is already a full, tested, pure-Go doctree producer, and a second one here would duplicate real work for no fidelity gain. That dependency doubles as this package's own correctness proof."

[[params.repos]]
  name = "latex"
  pkg = "github.com/go-richdoc/latex"
  url = "https://github.com/go-richdoc/latex"
  status = "ready"
  blurb = "**A practical subset of LaTeX in, a compilable article out.** ⛔ This one *does* ship its own parser, and the reason is worth knowing: [go-tex/engine](https://github.com/go-tex/engine) is a typesetting engine whose tokenizer is internal — it exposes a compile API, not a reusable parse tree. The preamble is mined for metadata, the `document` environment is read for content, and anything the model has no node for survives verbatim as `RawInline`/`RawBlock` with `Format: \"latex\"`."

[[params.repos]]
  name = "data"
  pkg = "github.com/go-richdoc/data"
  url = "https://github.com/go-richdoc/data"
  status = "ready"
  blurb = "**CSV, JSON, XML and plain text into a document**, plus the `richdata` command that writes the result as Markdown. A table is the obvious shape for a CSV; what the package decides is everything else — when a JSON object is a table and when it is a list, and when a log file is better left verbatim than parsed into something it is not. ⛔ One byte of source buys between 60 and 176 bytes of heap, measured per format, which is why the ceilings are not on bytes alone. ⛔ A ceiling can stop the ANSWER and not the WORK (v0.2.0): two flat JSON arrays, both refused at the same node, the second eight times the source, cost 243 MB and **1.275 GB** — `encoding/json` builds the whole value before the first node is counted. A pass over the source bytes now refuses a hostile 16 MiB array in **40 bytes**, and the XML reader, which counts inside its own token walk, gave 1.0 on the same test. ⛔ And two ceilings that MULTIPLY: 100 000 rows of 1 000 columns sat inside both and was a hundred million cells — the same export already refused as JSON and accepted as CSV, which is the drift one shared package exists to prevent. ⛔ The fuzz target broke the new guard in **700 ms** with `0 0 0[0[0[0` — nine values to a scan of the file, *one* to `Decoder.Decode` — and the same input showed `Parse` had been returning **half a file in silence**, a second JSON value dropped with no error. Both fixed; a guard has to stop where the thing it guards stops."

[[params.repos]]
  name = "fb2"
  pkg = "github.com/go-richdoc/fb2"
  url = "https://github.com/go-richdoc/fb2"
  status = "ready"
  blurb = "**FictionBook 2 (`.fb2`) in** — the one ebook format a reader can do with `encoding/xml` and nothing else: a single XML file, no ZIP, no package document, no spine, images base64 inside that same file. ⛔ Section nesting is where a heading's level comes from, since FB2 has no `<h2>`; a title broken over several `<p>` is **one** heading; an image becomes its bytes as a data URL, because `#cover.jpg` is a name nothing can resolve once the file is closed — and the same picture named a thousand times is **one copy** (v0.1.1), where before it was allocated once per reference: 757 KB of source held 1.41 GB of heap. One token representation rather than two typed fields, after `encoding/xml` silently filled only one of two `,any` fields and every test came back empty with no error."

[[params.repos]]
  name = "html"
  pkg = "github.com/go-richdoc/html"
  url = "https://github.com/go-richdoc/html"
  status = "ready"
  blurb = "**HTML and XHTML in**, with the parse delegated to [`golang.org/x/net/html`](https://pkg.go.dev/golang.org/x/net/html) — the piece the ebook formats were missing, since EPUB's chapters are XHTML and an email's body usually is too. ⛔ What it **drops** is the interesting part: `script`, `style`, `noscript` and the head's contents go completely, because a stylesheet is text in the tree like any other text and is the reason naive converters emit a page of CSS as the first paragraph. The test for it reads a real published page and fails if `prefers-color-scheme` reaches the document. ⛔ Parsing XHTML with the HTML parser is also the **safe** choice: the HTML5 algorithm has no DTD, so an ebook cannot ask it to fetch a file or expand a billion laughs. ⛔ But delegating the parse means the ceilings bounded **our walk**, and the walk is not where the memory goes: `x/net/html` builds the whole tree before our first node is counted and has no ceiling of its own, so two documents refused at the same element — one eight times the source of the other — cost 12 MB and **96 MB**. Bounding the **source** instead (v0.2.0) refuses the same 3.2 MB document in **7 096 bytes**, the same figure at any file size. The defaults come from **123 369** real `.html` files, every one of which is accepted — and the probe asks the reader for its verdict rather than trusting a percentile, because the deepest of them tokenizes 3 140 levels against a limit of 256 and parses perfectly well."

[[params.repos]]
  name = "epub"
  pkg = "github.com/go-richdoc/epub"
  url = "https://github.com/go-richdoc/epub"
  status = "ready"
  blurb = "**EPUB 2 and 3 in.** An EPUB is three things in a trench coat — a ZIP, a manifest and an order — and none of them is the content. ⛔ Nothing is found by its path: the container names the package document, which names its content, and the **spine** is the only thing that says what order to read it in; an alphabetical walk of the archive puts chapter 10 before chapter 2. An image becomes its bytes, and the same picture referred to fifty times is inflated once. Measured on eleven real books (7 480 to 377 683 words each) which are deliberately **not** in the repository: they are somebody's library, and a fixture a test ships has to be one the repository may carry."

[[params.repos]]
  name = "mobi"
  pkg = "github.com/go-richdoc/mobi"
  url = "https://github.com/go-richdoc/mobi"
  status = "ready"
  blurb = "**Kindle MOBI in** — three formats stacked on each other, and reading one is reading all three: a Palm database of records, a record 0 holding the PalmDOC and MOBI headers, and the book itself as ONE HTML document cut into 4096-byte pieces and each piece compressed on its own. ⛔ The bytes at the end of a text record **are not text and are not compressed** — indexing data, and the overlap of a multibyte character split across two records — and feeding them to the decompressor does not fail: it produces plausible rubbish at the end of every record. ⛔ Pictures are named by **record number**, two different ways, and `kindle:embed:003C` is **base 32** and one-based: read as hexadecimal it would be wrong for every picture past the thirty-first and still look right for the first nine. Measured against Project Gutenberg's own *Pride and Prejudice* with Gutenberg's plain text of the same book as the judge: 125 816 words against 126 630, and 3 638 of 4 215 long sentences found verbatim. DRM, HUFF/CDIC and KF8 are refused **by name**, because none of those files is defective."

[[params.repos]]
  name = "email"
  pkg = "github.com/go-richdoc/email"
  url = "https://github.com/go-richdoc/email"
  status = "ready"
  blurb = "**RFC 5322 messages and MIME in** — a `.eml`, or whatever an IMAP server hands back. ⛔ Which part is the body is the whole job: an `alternative` is the same message twice and must be read **once**, a `related` is one message plus the pictures it names by `Content-Id`, a `mixed` is a sequence, and a `signed` is the message plus a signature that is not content. ⛔ **Nothing is fetched, ever**: an HTML mail's remote `<img>` is a tracking pixel as often as a picture, so only `cid:` parts that travelled inside the message are inlined — there is no network code in the package and no way to ask for any."
